name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shell syntax
        run: bash -n install.sh && for script in bin/* lib/common.sh; do bash -n "$script"; done
      - name: Unit and installation tests (no radio access)
        run: python3 -m unittest discover -s tests -v
